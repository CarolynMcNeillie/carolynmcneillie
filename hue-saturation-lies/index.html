  <body>
    <!-- Grayscale by luminance, for the .grayscale class. Each pixel becomes the grey
         with its own WCAG relative luminance (the weights act on linear light).
         CSS grayscale() weights the stored, gamma-encoded numbers instead, which
         turns pure blue nearly black (18 instead of 76). -->
    <svg class="filter-defs" aria-hidden="true" width="0" height="0">
      <filter id="luminance-gray" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
      </filter>
    </svg>

    <div id="slide-bg-b" class="slide-bg-layer" aria-hidden="true"></div>
    <div id="illustration" aria-hidden="true"></div>
    <div id="viz-layer"></div>
    <div id="demo-layer"></div>
    <div id="rotation-controls" role="group" aria-label="View controls">
      <button class="pill-button" data-axis="x" aria-pressed="false">Lightness</button>
      <button class="pill-button" data-axis="z" aria-pressed="false">Chroma</button>
      <button class="pill-button" data-axis="y" aria-pressed="false">Hue</button>
      <button class="icon-button" id="viz-grayscale" aria-label="Grayscale" title="Grayscale" aria-pressed="false"></button>
    </div>
    <div id="slide-text" role="complementary" aria-label="Presenter notes">

          <label for="script-edit-body">Script body</label>

          <div class="script-meta"><span id="script-edit-count"></span><span id="script-edit-status" role="status" aria-live="polite"></span></div>
        </div>
      </div>
    </div>
    <div id="timeline-band"><div id="timeline-row"></div></div>
    <div id="slide-footer">
      <div id="progress-bar" aria-hidden="true"><div id="progress-fill"></div></div>
      <div id="timeline-content"></div>
    </div>
    <div id="slide-title-overlay"></div>
    <div id="slide-body-center"></div>

          y1="43"
          x2="82"
          y2="43"

          stroke-width="0.12"
          marker-end="url(#arr-l)"
        />
        <line

          y1="42.2"
          x2="18"
          y2="43.8"

          stroke-width="0.12"

        <text

        <text

        <line

        <text

        <div id="sorter-sections"></div>
      </div>
    </div>
