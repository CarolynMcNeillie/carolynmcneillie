    <style>
      /* CSS Reset & Base */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      * {
        margin: 0;
      }
      body {
        line-height: 1.8;
        -webkit-font-smoothing: antialiased;
      }
      img,
      picture,
      video,
      canvas,
      svg {
        display: block;
        max-width: 100%;
      }
      input,
      button,
      textarea,
      select {
        font: inherit;
      }
      p,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        overflow-wrap: break-word;
      }

      :root {
        --light: #1d1d1d;
        --medium: #344767;
        --dark: #1d1d1d;
      }

      body {
        color: var(--dark);
        line-height: 1.8;
        background-color: #1d1d1d;
        font-family: montserrat, system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100dvh;
      }

      h1 {
        font-family: montserrat, sans-serif;
        font-weight: 400;
        margin: 0;
        text-align: center;
        position: relative;
      }

      h1 {
        line-height: 1em;
        font-size: 48px;
        /* Top left, the same 24px inset as the card at the bottom right. */
        position: fixed;
        top: 24px;
        left: 24px;
        margin: 0;
        text-align: left;
        z-index: 1;
      }

      h1 img {
        width: 6.5520833333em;
        height: auto;
      }

      @media only screen and (max-width: 650px) {
        /* On phones the name and the card stack, centred. */
        h1 {
          font-size: clamp(24px, 7vw, 40px);
          position: relative;
          top: auto;
          left: auto;
          margin: 0 0 20px;
          text-align: center;
        }
      }

      a {
        text-decoration: none;
        color: var(--light);
        transition: color 0.4s;
        position: relative;
        white-space: nowrap;
      }

      a span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }

      a::after {
        content: "";
        display: block;
        position: absolute;
        width: 0%;
        height: 1px;
        background-color: var(--light);
        transition: width 0.2s ease-in-out;
        left: 0;
      }

      a:hover,
      a:focus {
        color: var(--dark);
      }

      a:hover::after {
        width: 100%;
      }

      a:focus-visible {
        outline: 3px solid var(--dark);
        outline-offset: 4px;
      }

      a:active {
        color: var(--medium);
      }

      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .card {
        width: min(20rem, 100%);
        margin: 0;
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 20px 28px;
        max-width: calc(100% - 48px);
        border: 8px solid transparent;
        border-image: url("images/card-paper.webp?v=20261124") 16 fill / 8px / 4px stretch;
        background: none;
        text-align: center;
        z-index: 1;
        min-width: 0;
      }

      address { font-style: normal; }
      .card a { overflow-wrap: anywhere; white-space: normal; }
      .card p a { text-decoration: underline; text-underline-offset: 3px; }

      /* Declared after .card so it wins on phones. */
      @media only screen and (max-width: 650px) {
        .card {
          position: relative;
          right: auto;
          bottom: auto;
          max-width: 100%;
        }
      }

      .socialList {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
      }

      .socialListItem {
        margin: 0 10px 0 0;
      }

      .socialListItem a {
        display: inline-flex;
        width: 40px;
        height: 40px;
        align-items: center;
        justify-content: center;
        transition: 0.4s;
        border-radius: 4px;
      }

      .socialListItem a:hover,
      .socialListItem a:focus {
        background-color: #f1e5df;
      }

      .socialListItem a::after {
        display: none;
      }

      .socialListItem img {
        width: 70%;
        height: auto;
        filter: brightness(0);
      }

      .socialList { margin-top: 16px; }
      #riso-background {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #riso-background canvas,
      #riso-background .paper-ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #riso-background .outgoing { z-index: 0; }
      #riso-background .paper-ring { z-index: 1; }
      #riso-background .incoming { z-index: 2; }
      #riso-background [hidden] { display: none; }
    </style>
